<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Highway Dashboard</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <header>
        <h1>Highway Dashboard</h1>

        <!--
            Broker identity ONLY. It used to share this element with error text, and
            only one poller ever rewrote it — so "Connection error: Failed to fetch"
            could sit above a fully-rendered page for ever (022 R6.1).
        -->
        <p id="broker-info">Connecting…</p>

        <nav>
            <a href="#/catalogue">Catalogue</a>
            <a href="#/nodes">Nodes</a>
            <a href="#/diagnostics">Diagnostics</a>
        </nav>

        <div id="exposure-banner" class="banner hidden" role="alert"></div>

        <!-- Keyed by source: each poller owns an entry, and success clears its own. -->
        <div id="error-region" class="error-region hidden" role="alert"></div>
    </header>

    <main id="view">Loading…</main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
